plugins { id 'com.android.application' }

android {
    namespace 'br.com.w1capital.opencode'
    compileSdk 35
    defaultConfig {
        applicationId 'br.com.w1capital.opencode.android'
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('W1_ANDROID_VERSION_CODE') ?: '1')
        versionName System.getenv('W1_ANDROID_VERSION_NAME') ?: '1.0.1'
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
}
