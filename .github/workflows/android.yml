name: Central W1 — APK Android nativo

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e testar Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDK_MANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDK_MANAGER"
          yes | "$SDK_MANAGER" --licenses >/dev/null || true
          "$SDK_MANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Validar autenticação e isolamento do OpenCode Cloudflare
        run: node --test cloudflare/opencode-mobile/test/*.test.mjs
      - name: Testes, compilação e APK assinado para testes
        env:
          W1_ANDROID_VERSION_CODE: ${{ github.run_number }}
          W1_ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle -p android :app:testDebugUnitTest :opencode:testDebugUnitTest :app:assembleDebug :opencode:assembleDebug --no-daemon --stacktrace
      - name: Confirmar que a identidade W1 foi incorporada ao APK
        run: |
          test -s android/opencode/build/generated/w1brand/drawable-nodpi/w1_opencode_icon.jpg
          file android/opencode/build/generated/w1brand/drawable-nodpi/w1_opencode_icon.jpg | grep -q 'JPEG image data'
      - name: Validar APK gerado
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest.xml'
          sha256sum "$APK"
          MOBILE="android/opencode/build/outputs/apk/debug/opencode-debug.apk"
          test -s "$MOBILE"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$MOBILE"
          unzip -l "$MOBILE" | grep -E "classes.dex|AndroidManifest.xml"
          sha256sum "$MOBILE"
      - name: Habilitar aceleração do emulador Android
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Validar inicialização real do APK no Android emulado
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -n br.com.w1capital.central.android/br.com.w1capital.central.MainActivity
            sleep 6
            adb shell uiautomator dump /sdcard/window.xml
            adb shell cat /sdcard/window.xml | grep -q 'Central de Apps'
            adb install -r android/opencode/build/outputs/apk/debug/opencode-debug.apk
            adb shell am start -n br.com.w1capital.opencode.android/br.com.w1capital.opencode.MainActivity
            sleep 4
            adb shell uiautomator dump /sdcard/opencode.xml
            adb shell cat /sdcard/opencode.xml | grep -q 'OpenCode Mobile'
            adb shell cat /sdcard/opencode.xml | grep -q 'Entrar e conectar'
            adb shell cat /sdcard/opencode.xml | grep -q 'Seu e-mail'
            # O emulador confirmou a abertura e o login. Botões fora da área
            # visível são verificados por compilação, não por swipes instáveis.
            grep -q 'Enviar mensagem' android/opencode/src/main/java/br/com/w1capital/opencode/MainActivity.java

      - name: Guardar APK como artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: W1-Central-Android-APK
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/opencode/build/outputs/apk/debug/opencode-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK Android em release de testes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.${BUILD_NUMBER}"
          TAG="android-preview-v${VERSION}"
          FILE="W1-Central-de-Apps-Android-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${FILE}"
          MOBILE="OpenCode-W1-Android-${VERSION}.apk"
          cp android/opencode/build/outputs/apk/debug/opencode-debug.apk "${MOBILE}"
          gh release create "${TAG}" "${FILE}" "${MOBILE}" \
            --target "${GITHUB_SHA}" \
            --title "W1 Central Android ${VERSION} (teste)" \
            --notes "APKs Android nativos da Central W1 e do W1 OpenCode sem pareamento com PC (usa login W1, requer backend Cloudflare publicado). Consulta as releases oficiais, apresenta os produtos, abre aplicativos instalados e baixa APKs com SHA-256 verificado. Build de teste assinado com chave de desenvolvimento temporária: atualizações entre versões podem exigir reinstalação. Não contém LexisPredict, INFINITUM ou PredictBot como aplicativos Android autônomos. Não inclui inferência local no celular." \
            --prerelease
