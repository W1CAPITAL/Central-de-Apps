name: Central W1 — APK Android nativo

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compilar e testar Android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Instalar Android SDK
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Testes, compilação e APK assinado para testes
        env:
          W1_ANDROID_VERSION_CODE: ${{ github.run_number }}
          W1_ANDROID_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          gradle -p android :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Validar APK gerado
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep -E 'classes.dex|AndroidManifest.xml'
          sha256sum "$APK"
      - name: Guardar APK como artefato do GitHub
        uses: actions/upload-artifact@v4
        with:
          name: W1-Central-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publicar APK Android em release de testes
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_NUMBER: ${{ github.run_number }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="1.0.${BUILD_NUMBER}"
          TAG="android-preview-v${VERSION}"
          FILE="W1-Central-de-Apps-Android-${VERSION}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${FILE}"
          gh release create "${TAG}" "${FILE}" \
            --target "${GITHUB_SHA}" \
            --title "W1 Central Android ${VERSION} (teste)" \
            --notes "APK Android nativo da Central W1. Consulta as releases oficiais, apresenta os produtos, abre aplicativos instalados e baixa APKs com SHA-256 verificado. Build de teste assinado com chave de desenvolvimento temporária: atualizações entre versões podem exigir reinstalação. Não contém LexisPredict, INFINITUM ou PredictBot como aplicativos Android autônomos. Não inclui inferência local no celular." \
            --prerelease
