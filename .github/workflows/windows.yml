name: Central W1 — Windows e aplicativos independentes

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '13 */6 * * *'

permissions:
  contents: read

concurrency:
  group: central-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inspect:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.sources.outputs.build }}
      lexis_sha: ${{ steps.sources.outputs.lexis_sha }}
      infinitum_sha: ${{ steps.sources.outputs.infinitum_sha }}
      predictbot_sha: ${{ steps.sources.outputs.predictbot_sha }}
    steps:
      - name: Detectar origens e evitar builds repetidos
        id: sources
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          lexis_sha="$(git ls-remote https://github.com/W1CAPITAL/LexisPredict.git refs/heads/main | cut -f1)"
          infinitum_sha="$(git ls-remote https://github.com/W1CAPITAL/Infinitum.git refs/heads/main | cut -f1)"
          predictbot_sha="$(git ls-remote https://github.com/W1CAPITAL/PredictBot.git refs/heads/main | cut -f1)"
          test "${#lexis_sha}" -eq 40
          test "${#infinitum_sha}" -eq 40
          test "${#predictbot_sha}" -eq 40
          echo "lexis_sha=$lexis_sha" >> "$GITHUB_OUTPUT"
          echo "infinitum_sha=$infinitum_sha" >> "$GITHUB_OUTPUT"
          echo "predictbot_sha=$predictbot_sha" >> "$GITHUB_OUTPUT"
          build=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            release_dir="$(mktemp -d)"
            latest_tag="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=1" --jq '.[0].tag_name // empty')"
            if [ -n "$latest_tag" ] && gh release download "$latest_tag" --repo "$GITHUB_REPOSITORY" --pattern source-commits.json --dir "$release_dir" >/dev/null 2>&1; then
              if python3 -c 'import json,sys; x=json.load(open(sys.argv[1]));sys.exit(0 if x.get("lexispredict")==sys.argv[2] and x.get("infinitum")==sys.argv[3] and x.get("predictbot")==sys.argv[4] and x.get("central")==sys.argv[5] else 1)' "$release_dir/source-commits.json" "$lexis_sha" "$infinitum_sha" "$predictbot_sha" "$GITHUB_SHA"; then
                build=false
              fi
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts
      - name: Testar catálogo, escopo de IPC e inicialização local
        run: |
          npm run check
          npm test
  windows:
    needs: [inspect,test]
    if: needs.inspect.outputs.build == 'true'
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - name: Código da Central de Apps
        uses: actions/checkout@v4
        with:
          path: central
      - name: Código PredictBot fixado na main atual
        uses: actions/checkout@v4
        with:
          repository: W1CAPITAL/PredictBot
          ref: ${{ needs.inspect.outputs.predictbot_sha }}
          path: central/apps-src/predictbot
          persist-credentials: false
      - name: Código-fonte LexisPredict da main
        uses: actions/checkout@v4
        with:
          repository: W1CAPITAL/LexisPredict
          ref: ${{ needs.inspect.outputs.lexis_sha }}
          path: central/apps-src/lexispredict
          persist-credentials: false
      - name: Código-fonte INFINITUM da main
        uses: actions/checkout@v4
        with:
          repository: W1CAPITAL/Infinitum
          ref: ${{ needs.inspect.outputs.infinitum_sha }}
          path: central/apps-src/infinitum
          persist-credentials: false
      - name: Node 24 e pnpm 10
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Instalar dependências LexisPredict
        working-directory: central/apps-src/lexispredict
        run: pnpm install --frozen-lockfile
      - name: Validar sintaxe do helper de atualização
        working-directory: central
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'src/install-update.ps1'), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw ($errors | Out-String) }
      - name: Testes e tipos LexisPredict
        working-directory: central/apps-src/lexispredict
        run: |
          pnpm run typecheck
          pnpm test
      - name: Compilar LexisPredict Next standalone (sem Vercel)
        working-directory: central/apps-src/lexispredict
        # package.json usa NODE_ENV=production (sintaxe Unix); no Windows o env é fornecido abaixo.
        run: pnpm exec next build
        env:
          NODE_ENV: production
          LEXIS_DESKTOP_STANDALONE: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://segjskjlbeydlljnefai.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'sb_publishable_yEX6mVid3dpC7o7eOzuB1g_VhQodoTg'
          SUPABASE_SERVICE_ROLE_KEY: ''
          CRON_SECRET: ''
      - name: Instalar dependências INFINITUM
        working-directory: central/apps-src/infinitum
        run: npm install --no-audit --no-fund
      - name: Testes e tipos INFINITUM
        working-directory: central/apps-src/infinitum
        run: |
          npm test
          npm run typecheck
          npm run test:dom
      - name: Compilar INFINITUM Next standalone (sem Vercel)
        working-directory: central/apps-src/infinitum
        run: npm run build
        env:
          NODE_ENV: production
          KILLA_DESKTOP_STANDALONE: '1'
          NEXT_PUBLIC_LEXIS_SHARED_DB: '1'
          NEXT_PUBLIC_SUPABASE_URL: 'https://segjskjlbeydlljnefai.supabase.co'
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: 'sb_publishable_yEX6mVid3dpC7o7eOzuB1g_VhQodoTg'
      - name: Preparar os dois servidores locais no instalador Central
        working-directory: central
        run: |
          node scripts/stage-next.mjs apps-src/lexispredict lexispredict
          node scripts/stage-next.mjs apps-src/infinitum infinitum
      - name: Preparar EXE da Central e fixar versão
        working-directory: central
        shell: pwsh
        env:
          PREDICTBOT_SHA: ${{ needs.inspect.outputs.predictbot_sha }}
        run: |
          $v = '0.1.' + $env:GITHUB_RUN_NUMBER
          node -e "const fs=require('fs');let p=require('./package.json');p.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')" $v
          node -e "const fs=require('fs');const p=require('./package.json');p.dependencies['@w1capital/predictbot-opencode']='https://codeload.github.com/W1CAPITAL/PredictBot/tar.gz/'+process.env.PREDICTBOT_SHA;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          npm install --no-audit --no-fund
          npm run check
          npm test
          "CENTRAL_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Validar pacote PredictBot da origem fixada
        working-directory: central/apps-src/predictbot
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run check
          npm test
      - name: Criar logo W1 Capital nos ícones dos quatro EXEs
        working-directory: central
        shell: pwsh
        run: ./scripts/create-icons.ps1
      - name: Gerar EXE com LexisPredict e INFINITUM locais
        working-directory: central
        run: npm run pack:win
        env:
          WIN_CSC_LINK: ${{ github.ref == 'refs/heads/main' && secrets.CENTRAL_WINDOWS_CERT_P12 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.CENTRAL_WINDOWS_CERT_PASSWORD || '' }}
      - name: Smoke test real dos dois servidores no EXE
        working-directory: central
        run: node scripts/verify-products.mjs
      - name: Abrir a loja e os dois aplicativos no EXE real
        working-directory: central
        run: |
          npm install --prefix ../desktop-test --no-package-lock --ignore-scripts --no-audit --no-fund playwright-core@1.65.1
          node scripts/verify-desktop-ui.mjs
      - name: Guardar capturas do teste visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Central-desktop-smoke-${{ github.run_number }}
          path: central/desktop-smoke/
          if-no-files-found: ignore
      - name: Gerar instalador Central de Apps Windows x64
        working-directory: central
        run: npm run dist:win
        env:
          WIN_CSC_LINK: ${{ github.ref == 'refs/heads/main' && secrets.CENTRAL_WINDOWS_CERT_P12 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.CENTRAL_WINDOWS_CERT_PASSWORD || '' }}
      - name: Instalar NSIS em pasta limpa do runner e testar o EXE instalado
        working-directory: central
        shell: pwsh
        run: |
          $installer = 'dist/W1-Central-de-Apps-Setup-' + $env:CENTRAL_VERSION + '-x64.exe'
          $installDir = Join-Path $env:RUNNER_TEMP 'W1CentralInstalled'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S',('/D='+$installDir)) -PassThru
          if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Instalação silenciosa do NSIS excedeu 3 minutos."
          }
          if ($process.ExitCode -ne 0) { throw "NSIS falhou: $($process.ExitCode)" }
          $installed = Join-Path $installDir 'W1 Central de Apps.exe'
          if (-not (Test-Path -LiteralPath $installed -PathType Leaf)) { throw 'NSIS não instalou o EXE.' }
          node scripts/verify-desktop-ui.mjs $installed desktop-smoke-installed
          if ($LASTEXITCODE -ne 0) { throw 'EXE instalado falhou no teste visual.' }
          $originalPath = (Resolve-Path -LiteralPath $installed).Path
          $repeat = Start-Process -FilePath $installer -ArgumentList @('/S',('/D='+$installDir)) -PassThru
          if (-not $repeat.WaitForExit(180000)) {
            Stop-Process -Id $repeat.Id -Force -ErrorAction SilentlyContinue
            throw "Reinstalação silenciosa do NSIS excedeu 3 minutos."
          }
          if ($repeat.ExitCode -ne 0) { throw 'A atualização sobre a instalação existente falhou.' }
          $updatedPath = (Resolve-Path -LiteralPath $installed).Path
          $copies = @(Get-ChildItem -LiteralPath $installDir -Filter 'W1 Central de Apps.exe' -File -Recurse)
          if ($updatedPath -ne $originalPath -or $copies.Count -ne 1) { throw 'A atualização criou uma segunda instalação da Central.' }
      - name: Guardar capturas da instalação real no runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Central-installed-smoke-${{ github.run_number }}
          path: central/desktop-smoke-installed/
          if-no-files-found: ignore
      - name: Empacotar e abrir LexisPredict e PredictBot independentes
        working-directory: central
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ github.ref == 'refs/heads/main' && secrets.CENTRAL_WINDOWS_CERT_P12 || '' }}
          WIN_CSC_KEY_PASSWORD: ${{ github.ref == 'refs/heads/main' && secrets.CENTRAL_WINDOWS_CERT_PASSWORD || '' }}
        run: |
          foreach ($id in @('lexispredict','infinitum','predictbot')) {
            $name = if ($id -eq 'lexispredict') { 'LexisPredict' } elseif ($id -eq 'infinitum') { 'INFINITUM' } else { 'PredictBot' }
            node scripts/package-product.mjs $id dir
            if ($LASTEXITCODE -ne 0) { throw "Pack falhou: $id" }
            $exe = "dist/products/$id/win-unpacked/$name.exe"
            node scripts/verify-desktop-ui.mjs $exe ("desktop-smoke-products/"+$id) $id
            if ($LASTEXITCODE -ne 0) { throw "EXE independente falhou: $id" }
          }
      - name: Gerar e instalar os instaladores independentes na main
        if: github.ref == 'refs/heads/main'
        working-directory: central
        shell: pwsh
        env:
          WIN_CSC_LINK: ${{ secrets.CENTRAL_WINDOWS_CERT_P12 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.CENTRAL_WINDOWS_CERT_PASSWORD }}
        run: |
          foreach ($id in @('lexispredict','infinitum','predictbot')) {
            $name = if ($id -eq 'lexispredict') { 'LexisPredict' } elseif ($id -eq 'infinitum') { 'INFINITUM' } else { 'PredictBot' }
            node scripts/package-product.mjs $id nsis
            if ($LASTEXITCODE -ne 0) { throw "NSIS falhou: $id" }
            $installer = "dist/products/$id/$name-Setup-$env:CENTRAL_VERSION-x64.exe"
            $installDir = Join-Path $env:RUNNER_TEMP ("W1ProductInstalled-"+$id)
            $process = Start-Process -FilePath $installer -ArgumentList @('/S',('/D='+$installDir)) -PassThru
            if (-not $process.WaitForExit(180000)) {
            Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            throw "Instalação silenciosa do NSIS excedeu 3 minutos."
          }
          if ($process.ExitCode -ne 0) { throw "Instalação falhou: $id" }
            $installedExe = Join-Path $installDir "$name.exe"
            node scripts/verify-desktop-ui.mjs $installedExe ("desktop-smoke-products/installed-"+$id) $id
            if ($LASTEXITCODE -ne 0) { throw "EXE instalado falhou: $id" }
            $originalPath = (Resolve-Path -LiteralPath $installedExe).Path
            $repeat = Start-Process -FilePath $installer -ArgumentList @('/S',('/D='+$installDir)) -PassThru
            if (-not $repeat.WaitForExit(180000)) {
            Stop-Process -Id $repeat.Id -Force -ErrorAction SilentlyContinue
            throw "Reinstalação silenciosa do NSIS excedeu 3 minutos."
          }
          if ($repeat.ExitCode -ne 0) { throw "Atualização sobre a instalação existente falhou: $id" }
            $updatedPath = (Resolve-Path -LiteralPath $installedExe).Path
            $copies = @(Get-ChildItem -LiteralPath $installDir -Filter "$name.exe" -File -Recurse)
            if ($updatedPath -ne $originalPath -or $copies.Count -ne 1) { throw "A atualização criou uma segunda instalação: $id" }
          }
      - name: Guardar capturas dos aplicativos independentes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Product-desktop-smoke-${{ github.run_number }}
          path: central/desktop-smoke-products/
          if-no-files-found: ignore
      - name: Guardar os commits de origem
        working-directory: central
        shell: pwsh
        env:
          LEXIS_SHA: ${{ needs.inspect.outputs.lexis_sha }}
          INFINITUM_SHA: ${{ needs.inspect.outputs.infinitum_sha }}
          PREDICTBOT_SHA: ${{ needs.inspect.outputs.predictbot_sha }}
        run: |
          $record = @{ lexispredict=$env:LEXIS_SHA; infinitum=$env:INFINITUM_SHA; predictbot=$env:PREDICTBOT_SHA; central=$env:GITHUB_SHA } | ConvertTo-Json -Compress
          $record | Set-Content -Path 'source-commits.json' -Encoding utf8
      - name: Arquivar instalador Windows
        uses: actions/upload-artifact@v4
        with:
          name: W1-Central-de-Apps-Windows-x64-${{ env.CENTRAL_VERSION }}
          path: |
            central/dist/W1-Central-de-Apps-Setup-${{ env.CENTRAL_VERSION }}-x64.exe
            central/source-commits.json
            central/dist/products/lexispredict/LexisPredict-Setup-${{ env.CENTRAL_VERSION }}-x64.exe
            central/dist/products/infinitum/INFINITUM-Setup-${{ env.CENTRAL_VERSION }}-x64.exe
            central/dist/products/predictbot/PredictBot-Setup-${{ env.CENTRAL_VERSION }}-x64.exe
          if-no-files-found: error
          retention-days: 30
  publish:
    needs: [windows]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Baixar os instaladores Windows testados
        uses: actions/download-artifact@v4
        with:
          name: W1-Central-de-Apps-Windows-x64-0.1.${{ github.run_number }}
          path: central
      - name: Conferir os pacotes e calcular SHA-256
        working-directory: central
        shell: pwsh
        run: |
          $installers = @(
            'dist/W1-Central-de-Apps-Setup-0.1.${{ github.run_number }}-x64.exe',
            'dist/products/lexispredict/LexisPredict-Setup-0.1.${{ github.run_number }}-x64.exe',
            'dist/products/infinitum/INFINITUM-Setup-0.1.${{ github.run_number }}-x64.exe',
            'dist/products/predictbot/PredictBot-Setup-0.1.${{ github.run_number }}-x64.exe'
          )
          foreach ($file in $installers) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw "Instalador ausente: $file" }
            if ((Get-Item -LiteralPath $file).Length -lt 1000000) { throw "Instalador incompleto: $file" }
          }
          if (-not (Test-Path -LiteralPath 'source-commits.json' -PathType Leaf)) { throw 'Registro de commits ausente.' }
          $sums = foreach ($file in $installers) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($file))"
          }
          $sums | Set-Content -LiteralPath 'SHA256SUMS.txt' -Encoding ascii
      - name: Gerar manifesto estável alternativo à API GitHub
        working-directory: central
        run: node scripts/create-release-catalog.mjs 0.1.${{ github.run_number }}
      - name: Publicar release estável para atualização automática
        working-directory: central
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = 'v0.1.${{ github.run_number }}'
          $notes = @(
            "Central de Apps W1 $tag",
            '',
            'Atualização automática aplicada sobre a instalação existente, no mesmo diretório.',
            'Não cria uma pasta por versão nem uma segunda instalação do aplicativo.',
            'O instalador é baixado do GitHub e conferido por SHA-256 antes da execução.',
            'A atualização é aplicada quando o aplicativo é fechado e reabre a versão atualizada.',
            'Authenticode não é requisito para este mecanismo. O SmartScreen do Windows permanece ativo e pode avisar na instalação inicial.'
          ) -join "`n"
          $assets = @(
            'dist/W1-Central-de-Apps-Setup-0.1.${{ github.run_number }}-x64.exe',
            'dist/products/lexispredict/LexisPredict-Setup-0.1.${{ github.run_number }}-x64.exe',
            'dist/products/infinitum/INFINITUM-Setup-0.1.${{ github.run_number }}-x64.exe',
            'dist/products/predictbot/PredictBot-Setup-0.1.${{ github.run_number }}-x64.exe',
            'source-commits.json',
            'SHA256SUMS.txt',
            'release-catalog.json'
          )
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --latest --title ("Central de Apps "+$tag) --notes $notes @assets
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/tags/$tag" | ConvertFrom-Json
          $manifest = Get-Content -LiteralPath 'release-catalog.json' -Raw | ConvertFrom-Json
          if ($manifest.tag_name -ne $tag) { throw "Manifesto não corresponde à versão publicada." }
          foreach ($file in $assets[0..3]) {
            $name = [IO.Path]::GetFileName($file)
            $manifestAsset = $manifest.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            $published = $release.assets | Where-Object { $_.name -eq $name } | Select-Object -First 1
            if (-not $manifestAsset -or -not $published -or $published.digest -ne $manifestAsset.digest) {
              throw "Digest publicado não confere: $name"
            }
          }
